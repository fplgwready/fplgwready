<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FPLGWReady — Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F9FF; --surface: #FFFFFF; --surface2: #F0F2FF;
      --accent: #1A6FFF; --accent2: #6C5CE7; --text: #1A1535;
      --muted: #6B63A8; --border: rgba(108,92,231,0.15); --radius: 16px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(108,92,231,0.07) 0%, transparent 70%); pointer-events: none; }
    body::after { content: ''; position: fixed; bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(26,111,255,0.06) 0%, transparent 70%); pointer-events: none; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(248,249,255,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .logo span { color: var(--accent2); }
    .nav-links { display: flex; gap: 8px; }
    .nav-link { background: var(--surface2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 100px; font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .nav-link:hover, .nav-link.active { color: var(--text); border-color: var(--accent2); }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 24px 80px; }
    .page-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
    .page-title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 800; }
    .player-count { font-size: 13px; color: var(--muted); }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .filter-group { display: flex; gap: 6px; }
    .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; }
    .filter-btn:hover { color: var(--text); border-color: var(--accent2); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-btn.pos-gk.active { background: #B8860B; border-color: #B8860B; color: #fff; }
    .filter-btn.pos-def.active { background: #1A6FFF; border-color: #1A6FFF; color: #fff; }
    .filter-btn.pos-mid.active { background: #00976B; border-color: #00976B; color: #fff; }
    .filter-btn.pos-fwd.active { background: #E84040; border-color: #E84040; color: #fff; }
    .search-input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; color: var(--text); font-family: 'Inter', sans-serif; outline: none; width: 200px; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); opacity: 0.7; }
    .divider { width: 1px; height: 28px; background: var(--border); }
    .loading { text-align: center; padding: 80px 0; color: var(--muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 1px 8px rgba(108,92,231,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    thead { background: var(--surface2); }
    th { padding: 12px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; text-align: left; cursor: pointer; white-space: nowrap; user-select: none; border-bottom: 1px solid var(--border); transition: color 0.15s; }
    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th .sort-arrow { margin-left: 4px; opacity: 0.5; }
    th.sorted .sort-arrow { opacity: 1; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; background: var(--surface); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }
    .jersey { width: 28px; height: 28px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; flex-shrink: 0; }
    .player-cell { display: flex; align-items: center; gap: 10px; }
    .player-name { font-weight: 600; font-size: 13px; color: var(--text); }
    .player-team { font-size: 11px; color: var(--muted); }
    .pos-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .pos-gk { background: rgba(184,134,11,0.12); color: #B8860B; }
    .pos-def { background: rgba(26,111,255,0.12); color: var(--accent); }
    .pos-mid { background: rgba(0,151,107,0.12); color: #00976B; }
    .pos-fwd { background: rgba(232,64,64,0.12); color: #E84040; }
    .xp-val { font-size: 15px; font-weight: 800; color: var(--accent); }
    .xp-next { font-size: 15px; font-weight: 800; color: var(--accent2); }
    .eo-cell { display: flex; align-items: center; gap: 8px; }
    .eo-bar-bg { flex: 1; max-width: 60px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    .eo-bar-fill { height: 100%; border-radius: 2px; background: var(--accent2); }
    .eo-val { font-size: 12px; color: var(--muted); min-width: 36px; }
    .eo-diff { font-size: 10px; background: rgba(232,64,64,0.1); color: #E84040; padding: 1px 6px; border-radius: 4px; }
    .price-val { font-size: 13px; font-weight: 600; color: var(--text); }
    .form-val { font-size: 13px; color: var(--muted); }
    .form-high { color: #00976B; font-weight: 600; }
    .form-mid { color: #C47F00; font-weight: 500; }
    .empty { text-align: center; padding: 60px 0; color: var(--muted); }
    @media (max-width: 768px) {
      nav { padding: 14px 16px; }
      .nav-links { gap: 4px; }
      .nav-link { padding: 5px 10px; font-size: 11px; }
      .filters { gap: 8px; }
    }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/"><img src="/logo.jpeg" alt="" style="width:34px;height:34px;border-radius:8px;object-fit:cover;object-position:center 32%;flex-shrink:0;"/><span>FPL</span>GWReady</a>
  <div class="nav-links">
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/team.html">My Team</a>
    <a class="nav-link active" href="/players.html">Players</a>
    <a class="nav-link" href="/mini-league.html">Mini League</a>
    <a class="nav-link" href="/next-move.html">Next Move</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">Players 📋</div>
    <div class="player-count" id="player-count">Loading...</div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <button class="filter-btn active" onclick="filterPos('ALL', this)">All</button>
      <button class="filter-btn pos-gk" onclick="filterPos('GK', this)">GK</button>
      <button class="filter-btn pos-def" onclick="filterPos('DEF', this)">DEF</button>
      <button class="filter-btn pos-mid" onclick="filterPos('MID', this)">MID</button>
      <button class="filter-btn pos-fwd" onclick="filterPos('FWD', this)">FWD</button>
    </div>
    <div class="divider"></div>
    <div class="filter-group">
      <button class="filter-btn active-sort" id="sort-xp" onclick="sortBy('ep_this')">xP GW ↓</button>
      <button class="filter-btn" id="sort-xpnext" onclick="sortBy('ep_next')">xP Next</button>
      <button class="filter-btn" id="sort-eo" onclick="sortBy('eo')">EO</button>
      <button class="filter-btn" id="sort-form" onclick="sortBy('form')">Form</button>
      <button class="filter-btn" id="sort-price" onclick="sortBy('price')">Price</button>
    </div>
    <div class="divider"></div>
    <input type="text" class="search-input" id="search-input" placeholder="Search players..." oninput="filterSearch()"/>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading players...</p>
  </div>

  <div class="table-wrap" id="table-wrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th style="width:200px">Player</th>
          <th>Pos</th>
          <th onclick="sortBy('price')" id="th-price">Price <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('eo')" id="th-eo">EO% <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('form')" id="th-form">Form <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('ep_this')" id="th-ep_this">xP GW <span class="sort-arrow">↓</span></th>
          <th onclick="sortBy('ep_next')" id="th-ep_next">xP Next <span class="sort-arrow">↕</span></th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="players-tbody"></tbody>
    </table>
  </div>
  <div class="empty" id="empty-state" style="display:none;">No players found.</div>
</div>

<script>
const POS_MAP = { 1:'GK', 2:'DEF', 3:'MID', 4:'FWD' };
const POS_CLASS = { 1:'pos-gk', 2:'pos-def', 3:'pos-mid', 4:'pos-fwd' };

let allPlayers = [], teamMap = {}, currentPos = 'ALL';
let currentSort = 'ep_this', sortAsc = false, searchQuery = '';

async function fetchAPI(endpoint) {
  const res = await fetch(`/api/fpl?endpoint=${encodeURIComponent(endpoint)}`);
  if (res.ok) return await res.json();
  throw new Error('Failed to fetch data.');
}

const TEAM_COLORS = {
  1:['#EF0107','#FFFFFF'], 2:['#95BFE5','#670E36'], 3:['#E30613','#FFE000'],
  4:['#E41B17','#000000'], 5:['#FFCC00','#000000'], 6:['#0057B8','#FFFFFF'],
  7:['#034694','#FFFFFF'], 8:['#1B458F','#C4122E'], 9:['#003399','#FFFFFF'],
  10:['#FFFFFF','#000000'], 11:['#FFCD00','#1D428A'], 12:['#C8102E','#FFFFFF'],
  13:['#6CABDD','#FFFFFF'], 14:['#DA020E','#FFE500'], 15:['#000000','#FFFFFF'],
  16:['#E53233','#FFFFFF'], 17:['#EB172B','#FFFFFF'], 18:['#132257','#FFFFFF'],
  19:['#7A263A','#1BB1E7'], 20:['#FDB913','#231F20'],
};

function jerseyHTML(teamId, s) {
  const [bg, fg] = TEAM_COLORS[teamId] || ['#888','#fff'];
  return `<div class="jersey" style="background:${bg};color:${fg};border:1px solid rgba(0,0,0,0.1);">${s||'?'}</div>`;
}

function filterPos(pos, btn) {
  currentPos = pos;
  document.querySelectorAll('.filter-group:first-child .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function sortBy(key) {
  if (currentSort === key) sortAsc = !sortAsc;
  else { currentSort = key; sortAsc = false; }
  document.querySelectorAll('th').forEach(t => t.classList.remove('sorted'));
  const thEl = document.getElementById(`th-${key}`);
  if (thEl) { thEl.classList.add('sorted'); thEl.querySelector('.sort-arrow').textContent = sortAsc ? '↑' : '↓'; }
  renderTable();
}

function filterSearch() {
  searchQuery = document.getElementById('search-input').value.toLowerCase();
  renderTable();
}

function renderTable() {
  let filtered = allPlayers.filter(p => {
    if (currentPos !== 'ALL' && POS_MAP[p.element_type] !== currentPos) return false;
    if (searchQuery && !p.web_name.toLowerCase().includes(searchQuery) && !p.teamData?.name.toLowerCase().includes(searchQuery)) return false;
    return true;
  });

  const sortKeyMap = { ep_this:'ep_this_f', ep_next:'ep_next_f', eo:'eo_f', form:'form_f', price:'price_f' };
  const sortKey = sortKeyMap[currentSort] || 'ep_this_f';
  filtered.sort((a,b) => sortAsc ? a[sortKey]-b[sortKey] : b[sortKey]-a[sortKey]);

  document.getElementById('player-count').textContent = `${filtered.length} players`;
  const tbody = document.getElementById('players-tbody');
  tbody.innerHTML = '';

  if (!filtered.length) {
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('table-wrap').style.display = 'none';
    return;
  }
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'block';

  const statusMap = { a:'✅', d:'⚠️', i:'❌', s:'❌', u:'❌' };

  filtered.slice(0,200).forEach(p => {
    const team = p.teamData, teamShort = team?.short_name || '?';
    const isDiff = p.eo_f < 10;
    const formClass = p.form_f >= 7 ? 'form-high' : p.form_f >= 4 ? 'form-mid' : 'form-val';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="player-cell">${jerseyHTML(p.team,teamShort)}<div><div class="player-name">${p.web_name}</div><div class="player-team">${team?.name||'—'}</div></div></div></td>
      <td><span class="pos-badge ${POS_CLASS[p.element_type]}">${POS_MAP[p.element_type]}</span></td>
      <td><span class="price-val">£${p.price_f.toFixed(1)}m</span></td>
      <td><div class="eo-cell"><div class="eo-bar-bg"><div class="eo-bar-fill" style="width:${Math.min(100,p.eo_f)}%"></div></div><span class="eo-val">${p.eo_f.toFixed(1)}%</span>${isDiff?'<span class="eo-diff">Diff</span>':''}</div></td>
      <td><span class="${formClass}">${p.form_f.toFixed(1)}</span></td>
      <td><span class="xp-val">${p.ep_this_f.toFixed(1)}</span></td>
      <td><span class="xp-next">${p.ep_next_f.toFixed(1)}</span></td>
      <td>${statusMap[p.status]||'—'}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function loadPlayers() {
  try {
    const boot = await fetchAPI('bootstrap-static/');
    boot.teams.forEach(t => { teamMap[t.id] = t; });
    allPlayers = boot.elements.map(p => ({
      ...p,
      ep_this_f: parseFloat(p.ep_this)||0,
      ep_next_f: parseFloat(p.ep_next)||0,
      eo_f: parseFloat(p.selected_by_percent)||0,
      form_f: parseFloat(p.form)||0,
      price_f: p.now_cost/10,
      teamData: teamMap[p.team],
    }));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = 'block';
    renderTable();
  } catch(e) {
    document.getElementById('loading').innerHTML = `<p style="color:#E84040;">Failed to load data: ${e.message}</p>`;
  }
}

loadPlayers();
</script>

<div style="text-align:center;padding:24px;font-size:11px;color:#6B63A8;border-top:1px solid rgba(108,92,231,0.1);margin-top:40px;">
  Data sourced from <a href="https://fantasy.premierleague.com" target="_blank" style="color:#1A6FFF;text-decoration:none;">FPL Official API</a>
  · Built by <strong>FPLGWReady</strong>
</div>
</body>
</html>
