<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FPLGWReady — Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0B1F; --surface: #161330; --surface2: #1E1A40;
      --accent: #1A6FFF; --accent2: #6C5CE7; --text: #F0EEFF;
      --muted: #8B82C4; --border: rgba(108,92,231,0.2); --radius: 16px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(108,92,231,0.15) 0%, transparent 70%); pointer-events: none; }
    body::after { content: ''; position: fixed; bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(26,111,255,0.12) 0%, transparent 70%); pointer-events: none; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(13,11,31,0.85); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; text-decoration: none; color: var(--text); }
    .logo span { color: var(--accent2); }
    .nav-links { display: flex; gap: 8px; }
    .nav-link { background: var(--surface2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 100px; font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .nav-link:hover, .nav-link.active { color: var(--text); border-color: var(--accent2); }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 24px 80px; }
    .page-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; }
    .player-count { font-size: 13px; color: var(--muted); }

    /* Filters */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .filter-group { display: flex; gap: 6px; }
    .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-btn.pos-gk.active { background: #F9CA24; border-color: #F9CA24; color: #000; }
    .filter-btn.pos-def.active { background: #1A6FFF; border-color: #1A6FFF; color: #fff; }
    .filter-btn.pos-mid.active { background: #00B894; border-color: #00B894; color: #fff; }
    .filter-btn.pos-fwd.active { background: #FF7675; border-color: #FF7675; color: #fff; }
    .search-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; width: 200px; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .divider { width: 1px; height: 28px; background: var(--border); }

    /* Loading */
    .loading { text-align: center; padding: 80px 0; color: var(--muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    thead { background: var(--surface); }
    th { padding: 12px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; text-align: left; cursor: pointer; white-space: nowrap; user-select: none; border-bottom: 1px solid var(--border); transition: color 0.15s; }
    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th .sort-arrow { margin-left: 4px; opacity: 0.5; }
    th.sorted .sort-arrow { opacity: 1; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface); }
    td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }

    /* Jersey */
    .jersey { width: 28px; height: 28px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0; }

    /* Player cell */
    .player-cell { display: flex; align-items: center; gap: 10px; }
    .player-name { font-weight: 600; font-size: 13px; }
    .player-team { font-size: 11px; color: var(--muted); }

    /* Pos badge */
    .pos-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .pos-gk { background: rgba(249,202,36,0.15); color: #F9CA24; }
    .pos-def { background: rgba(26,111,255,0.15); color: #6BA3FF; }
    .pos-mid { background: rgba(0,184,148,0.15); color: #00B894; }
    .pos-fwd { background: rgba(255,118,117,0.15); color: #FF7675; }

    /* xP cell */
    .xp-val { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; color: var(--accent); }
    .xp-next { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; color: var(--accent2); }

    /* EO bar */
    .eo-cell { display: flex; align-items: center; gap: 8px; }
    .eo-bar-bg { flex: 1; max-width: 60px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    .eo-bar-fill { height: 100%; border-radius: 2px; background: var(--accent2); }
    .eo-val { font-size: 12px; color: var(--muted); min-width: 36px; }
    .eo-diff { font-size: 10px; background: rgba(255,118,117,0.15); color: #FF7675; padding: 1px 6px; border-radius: 4px; }

    /* FDR */
    .fdr-row { display: flex; gap: 4px; }
    .fdr-box { width: 28px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
    .fdr-1, .fdr-2 { background: rgba(0,184,148,0.25); color: #00B894; }
    .fdr-3 { background: rgba(253,203,110,0.25); color: #FDCB6E; }
    .fdr-4, .fdr-5 { background: rgba(255,118,117,0.25); color: #FF7675; }

    /* Status dot */
    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .status-a { background: #00B894; }
    .status-d { background: #FDCB6E; }
    .status-i, .status-s, .status-u { background: #FF7675; }

    /* Price */
    .price-val { font-size: 13px; font-weight: 500; }

    /* Form */
    .form-val { font-size: 13px; color: var(--muted); }
    .form-high { color: #00B894; font-weight: 600; }
    .form-mid { color: #FDCB6E; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 0; color: var(--muted); }

    @media (max-width: 768px) {
      nav { padding: 14px 16px; }
      .nav-links { gap: 4px; }
      .nav-link { padding: 5px 10px; font-size: 11px; }
      .filters { gap: 8px; }
    }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/"><span>FPL</span>GWReady</a>
  <div class="nav-links">
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/team.html">My Team</a>
    <a class="nav-link active" href="/players.html">Players</a>
    <a class="nav-link" href="/mini-league.html">Mini League</a>
    <a class="nav-link" href="/next-move.html">Next Move</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">Players 📋</div>
    <div class="player-count" id="player-count">Memuat...</div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <button class="filter-btn active" onclick="filterPos('ALL')">Semua</button>
      <button class="filter-btn pos-gk" onclick="filterPos('GK')">GK</button>
      <button class="filter-btn pos-def" onclick="filterPos('DEF')">DEF</button>
      <button class="filter-btn pos-mid" onclick="filterPos('MID')">MID</button>
      <button class="filter-btn pos-fwd" onclick="filterPos('FWD')">FWD</button>
    </div>
    <div class="divider"></div>
    <div class="filter-group">
      <button class="filter-btn active-sort" id="sort-xp" onclick="sortBy('ep_this')">xP GW ↓</button>
      <button class="filter-btn" id="sort-xpnext" onclick="sortBy('ep_next')">xP Next</button>
      <button class="filter-btn" id="sort-eo" onclick="sortBy('eo')">EO</button>
      <button class="filter-btn" id="sort-form" onclick="sortBy('form')">Form</button>
      <button class="filter-btn" id="sort-price" onclick="sortBy('price')">Harga</button>
    </div>
    <div class="divider"></div>
    <input type="text" class="search-input" id="search-input" placeholder="Cari pemain..." oninput="filterSearch()"/>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Memuat data pemain...</p>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="table-wrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th style="width:200px">Pemain</th>
          <th>Pos</th>
          <th onclick="sortBy('price')" id="th-price">Harga <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('eo')" id="th-eo">EO% <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('form')" id="th-form">Form <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('ep_this')" id="th-ep_this">xP GW <span class="sort-arrow">↓</span></th>
          <th onclick="sortBy('ep_next')" id="th-ep_next">xP Next <span class="sort-arrow">↕</span></th>
          <th>FDR 3 GW</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="players-tbody"></tbody>
    </table>
  </div>
  <div class="empty" id="empty-state" style="display:none;">Tidak ada pemain yang cocok.</div>
</div>

<script>
const POS_MAP = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
const POS_CLASS = { 1: 'pos-gk', 2: 'pos-def', 3: 'pos-mid', 4: 'pos-fwd' };

let allPlayers = [];
let teamMap = {};
let fixtureMap = {};
let currentPos = 'ALL';
let currentSort = 'ep_this';
let sortAsc = false;
let searchQuery = '';

async function fetchAPI(endpoint) {
  const res = await fetch(`/api/fpl?endpoint=${encodeURIComponent(endpoint)}`);
  if (res.ok) return await res.json();
  throw new Error('Gagal fetch data.');
}

// Team jersey colors (primary, secondary)
const TEAM_COLORS = {
  1:  ['#EF0107','#FFFFFF'], // Arsenal
  2:  ['#95BFE5','#FFFFFF'], // Aston Villa
  3:  ['#E30613','#000000'], // Bournemouth
  4:  ['#FFCC00','#000000'], // Brentford
  5:  ['#0057B8','#FFFFFF'], // Brighton
  6:  ['#034694','#FFFFFF'], // Chelsea
  7:  ['#1B458F','#FFFFFF'], // Crystal Palace
  8:  ['#003399','#FFFFFF'], // Everton
  9:  ['#003090','#FFFFFF'], // Fulham
  10: ['#0F5DA7','#FFFFFF'], // Ipswich
  11: ['#FDBE11','#000000'], // Leeds
  12: ['#003090','#FFFFFF'], // Leicester
  13: ['#C8102E','#FFFFFF'], // Liverpool
  14: ['#6CABDD','#FFFFFF'], // Man City
  15: ['#DA020E','#FFE500'], // Man Utd
  16: ['#000000','#FFFFFF'], // Newcastle
  17: ['#D71920','#FFFFFF'], // Nott'm Forest
  18: ['#D71920','#FFFFFF'], // Southampton
  19: ['#132257','#FFFFFF'], // Spurs
  20: ['#7A263A','#FFFFFF'], // West Ham
  21: ['#FDB913','#000000'], // Wolves
};

function getJerseyColor(teamId) {
  return TEAM_COLORS[teamId] || ['#444','#fff'];
}

function jerseyHTML(teamId, teamShort) {
  const [bg, fg] = getJerseyColor(teamId);
  return `<div class="jersey" style="background:${bg};color:${fg};">${teamShort || '?'}</div>`;
}

function fdrHTML(fdrs) {
  if (!fdrs || fdrs.length === 0) return '<span style="color:var(--muted);font-size:12px;">—</span>';
  return `<div class="fdr-row">${fdrs.slice(0, 3).map(f => `<div class="fdr-box fdr-${f}">${f}</div>`).join('')}</div>`;
}

async function loadPlayers() {
  try {
    const [boot, fixtures] = await Promise.all([
      fetchAPI('bootstrap-static/'),
      fetchAPI('fixtures/')
    ]);

    teamMap = {};
    boot.teams.forEach(t => { teamMap[t.id] = t; });

    // Build FDR map per team — next 3 fixtures
    const now = new Date();
    const upcomingFixtures = fixtures.filter(f => !f.finished).slice(0, 200);

    const teamFDR = {};
    boot.teams.forEach(t => {
      const teamFixtures = upcomingFixtures.filter(f => f.team_h === t.id || f.team_a === t.id).slice(0, 3);
      teamFDR[t.id] = teamFixtures.map(f => f.team_h === t.id ? f.team_h_difficulty : f.team_a_difficulty);
    });

    allPlayers = boot.elements.map(p => ({
      ...p,
      ep_this_f: parseFloat(p.ep_this) || 0,
      ep_next_f: parseFloat(p.ep_next) || 0,
      eo_f: parseFloat(p.selected_by_percent) || 0,
      form_f: parseFloat(p.form) || 0,
      price_f: p.now_cost / 10,
      fdrs: teamFDR[p.team] || [],
      teamData: teamMap[p.team],
    }));

    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = 'block';
    renderTable();

  } catch(e) {
    document.getElementById('loading').innerHTML = `<p style="color:#FF7675;">Gagal memuat data: ${e.message}</p>`;
  }
}

function filterPos(pos) {
  currentPos = pos;
  document.querySelectorAll('.filter-group:first-child .filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
}

function sortBy(key) {
  if (currentSort === key) { sortAsc = !sortAsc; }
  else { currentSort = key; sortAsc = false; }

  document.querySelectorAll('th').forEach(t => t.classList.remove('sorted'));
  const thEl = document.getElementById(`th-${key}`);
  if (thEl) { thEl.classList.add('sorted'); thEl.querySelector('.sort-arrow').textContent = sortAsc ? '↑' : '↓'; }

  renderTable();
}

function filterSearch() {
  searchQuery = document.getElementById('search-input').value.toLowerCase();
  renderTable();
}

function renderTable() {
  let filtered = allPlayers.filter(p => {
    if (currentPos !== 'ALL' && POS_MAP[p.element_type] !== currentPos) return false;
    if (searchQuery && !p.web_name.toLowerCase().includes(searchQuery) && !p.teamData?.name.toLowerCase().includes(searchQuery)) return false;
    return true;
  });

  const sortKey = {
    ep_this: 'ep_this_f', ep_next: 'ep_next_f',
    eo: 'eo_f', form: 'form_f', price: 'price_f'
  }[currentSort] || 'ep_this_f';

  filtered.sort((a, b) => sortAsc ? a[sortKey] - b[sortKey] : b[sortKey] - a[sortKey]);

  document.getElementById('player-count').textContent = `${filtered.length} pemain`;

  const tbody = document.getElementById('players-tbody');
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('table-wrap').style.display = 'none';
    return;
  }
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'block';

  filtered.slice(0, 200).forEach(p => {
    const team = p.teamData;
    const teamShort = team?.short_name || '?';
    const isDiff = p.eo_f < 10;
    const formClass = p.form_f >= 7 ? 'form-high' : p.form_f >= 4 ? 'form-mid' : 'form-val';
    const statusMap = { a: '✅', d: '⚠️', i: '❌', s: '❌', u: '❌' };

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="player-cell">
          ${jerseyHTML(p.team, teamShort)}
          <div>
            <div class="player-name">${p.web_name}</div>
            <div class="player-team">${team?.name || '—'}</div>
          </div>
        </div>
      </td>
      <td><span class="pos-badge ${POS_CLASS[p.element_type]}">${POS_MAP[p.element_type]}</span></td>
      <td><span class="price-val">£${p.price_f.toFixed(1)}m</span></td>
      <td>
        <div class="eo-cell">
          <div class="eo-bar-bg"><div class="eo-bar-fill" style="width:${Math.min(100, p.eo_f)}%"></div></div>
          <span class="eo-val">${p.eo_f.toFixed(1)}%</span>
          ${isDiff ? '<span class="eo-diff">Diff</span>' : ''}
        </div>
      </td>
      <td><span class="${formClass}">${p.form_f.toFixed(1)}</span></td>
      <td><span class="xp-val">${p.ep_this_f.toFixed(1)}</span></td>
      <td><span class="xp-next">${p.ep_next_f.toFixed(1)}</span></td>
      <td>${fdrHTML(p.fdrs)}</td>
      <td>${statusMap[p.status] || '—'}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadPlayers();
</script>
</body>
</html>
