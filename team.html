<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FPLGWReady — Team Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0B1F; --surface: #161330; --surface2: #1E1A40;
      --accent: #1A6FFF; --accent2: #6C5CE7; --text: #F0EEFF;
      --muted: #8B82C4; --border: rgba(108,92,231,0.2); --radius: 16px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(108,92,231,0.15) 0%, transparent 70%); pointer-events: none; }
    body::after { content: ''; position: fixed; bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(26,111,255,0.12) 0%, transparent 70%); pointer-events: none; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(13,11,31,0.85); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; text-decoration: none; color: var(--text); }
    .logo span { color: var(--accent2); }
    .nav-links { display: flex; gap: 8px; }
    .nav-link { background: var(--surface2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 100px; font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .nav-link:hover, .nav-link.active { color: var(--text); border-color: var(--accent2); }
    .container { max-width: 720px; margin: 40px auto; padding: 0 24px 80px; }
    .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 20px; }
    .input-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; display: block; }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 140px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 15px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }
    select { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 15px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; cursor: pointer; -webkit-appearance: none; }
    select:focus { border-color: var(--accent2); }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
    .btn:hover { opacity: 0.88; } .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .input-hint a { color: var(--accent); text-decoration: none; }
    .error-msg { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.2); color: #FF8080; border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-top: 10px; display: none; }
    .loading { display: none; text-align: center; padding: 40px 0; color: var(--muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { display: none; }
    .manager-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 26px; margin-bottom: 14px; }
    .manager-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .manager-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .manager-name { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 2px; }
    .team-name { color: var(--accent2); font-size: 13px; font-weight: 500; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stat-box { background: var(--surface2); border-radius: 10px; padding: 12px; text-align: center; }
    .stat-val { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
    .gw-nav { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 20px; margin-bottom: 14px; }
    .gw-nav-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; }
    .gw-nav-pts { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .gw-nav-pts span { color: var(--accent); font-weight: 700; font-size: 15px; }
    .gw-arrows { display: flex; gap: 8px; }
    .gw-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .gw-btn:hover { background: var(--accent2); border-color: var(--accent2); }
    .gw-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin: 16px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-badge { font-size: 10px; font-family: 'DM Sans', sans-serif; background: rgba(26,111,255,0.15); color: #6BA3FF; padding: 2px 8px; border-radius: 100px; }
    .bench-badge { background: rgba(108,92,231,0.15); color: var(--accent2); }
    .history-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .history-strip::-webkit-scrollbar { height: 3px; }
    .history-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .hs-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; text-align: center; flex-shrink: 0; cursor: pointer; transition: border-color 0.15s; min-width: 52px; }
    .hs-card:hover, .hs-card.active { border-color: var(--accent); }
    .hs-card.active { background: rgba(26,111,255,0.1); }
    .hs-gw { font-size: 9px; color: var(--muted); text-transform: uppercase; }
    .hs-pts { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; color: var(--accent); }
    .chip-badge { font-size: 9px; background: rgba(108,92,231,0.3); color: var(--accent2); padding: 1px 5px; border-radius: 4px; margin-top: 2px; display: inline-block; }
    .picks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .pick-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center; position: relative; transition: border-color 0.15s; }
    .pick-card:hover { border-color: var(--accent2); }
    .pick-card.is-captain::after { content: 'C'; position: absolute; top: 6px; right: 6px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .pick-card.is-vice::after { content: 'V'; position: absolute; top: 6px; right: 6px; background: var(--accent2); color: #fff; font-size: 9px; font-weight: 800; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .pick-pos { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
    .pick-pos.gk { color: #F9CA24; }
    .pick-pos.def { color: #6BA3FF; }
    .pick-pos.mid { color: #55EFC4; }
    .pick-pos.fwd { color: #FF7675; }
    .pick-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .pick-pts { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--accent); }
    .pick-pts.zero { color: var(--muted); }
    .pick-mult { font-size: 10px; color: var(--accent2); font-weight: 600; margin-top: 1px; }
    .pick-price { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .bench-divider { border-top: 1px dashed var(--border); padding-top: 4px; margin-top: 8px; }
    @media (max-width: 540px) { nav { padding: 14px 16px; } .stats-row { grid-template-columns: repeat(2,1fr); } .input-row { flex-direction: column; } .nav-links { gap: 4px; } .nav-link { padding: 5px 10px; font-size: 12px; } }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/"><span>FPL</span>GWReady</a>
  <div class="nav-links">
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link active" href="/team.html">My Team</a>
    <a class="nav-link" href="/mini-league.html">Mini League</a>
    <a class="nav-link" href="/next-move.html">Next Move</a>
  </div>
</nav>

<div class="container">
  <div class="input-card">
    <label class="input-label" for="fpl-id">FPL Team ID + Gameweek</label>
    <div class="input-row">
      <input type="text" id="fpl-id" placeholder="Team ID e.g. 222758" maxlength="10"/>
      <select id="gw-select"></select>
      <button class="btn" id="fetch-btn" onclick="fetchTeam()">Analyze →</button>
    </div>
    <p class="input-hint">Find your ID at <a href="https://fantasy.premierleague.com" target="_blank">fantasy.premierleague.com</a> → Points → check the URL</p>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div class="loading" id="loading"><div class="spinner"></div><p>Loading your gameweek...</p></div>

  <div class="result" id="result">
    <div class="manager-card">
      <div class="manager-header">
        <div class="manager-avatar" id="manager-avatar"></div>
        <div>
          <div class="manager-name" id="manager-name"></div>
          <div class="team-name" id="team-name"></div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val" id="gw-pts"></div><div class="stat-lbl">GW Points</div></div>
        <div class="stat-box"><div class="stat-val" id="gw-rank"></div><div class="stat-lbl">GW Rank</div></div>
        <div class="stat-box"><div class="stat-val" id="total-pts"></div><div class="stat-lbl">Total Points</div></div>
        <div class="stat-box"><div class="stat-val" id="overall-rank"></div><div class="stat-lbl">Overall Rank</div></div>
      </div>
    </div>

    <div class="section-title">Season Overview <span class="section-badge">Click GW to jump</span></div>
    <div class="history-strip" id="history-strip"></div>

    <div class="gw-nav">
      <div>
        <div class="gw-nav-title" id="gw-nav-title">Gameweek —</div>
        <div class="gw-nav-pts">Points: <span id="gw-nav-pts">—</span></div>
      </div>
      <div class="gw-arrows">
        <button class="gw-btn" id="btn-prev" onclick="navigateGW(-1)">← Prev</button>
        <button class="gw-btn" id="btn-next" onclick="navigateGW(1)">Next →</button>
      </div>
    </div>

    <div class="section-title">Starting XI <span class="section-badge" id="chip-label">GW Picks</span></div>
    <div class="picks-grid" id="picks-grid"></div>
    <div class="bench-divider">
      <div class="section-title">Bench <span class="section-badge bench-badge">Auto-sub candidates</span></div>
      <div class="picks-grid" id="bench-grid"></div>
    </div>
  </div>
</div>

<script>
const POS_MAP = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
const POS_CLASS = { 1: 'gk', 2: 'def', 3: 'mid', 4: 'fwd' };
const CHIP_MAP = { wildcard: 'Wildcard', freehit: 'Free Hit', bboost: 'Bench Boost', '3xc': 'Triple Captain' };
function fmt(n) { if (!n && n !== 0) return '—'; return n.toLocaleString(); }

async function fetchWithFallback(url) {
  const endpoint = url.replace('https://fantasy.premierleague.com/api/', '');
  const res = await fetch(`/api/fpl?endpoint=${encodeURIComponent(endpoint)}`);
  if (res.ok) return await res.json();
  throw new Error('Unable to connect. Please try again.');
}

const gwSelect = document.getElementById('gw-select');
for (let i = 1; i <= 38; i++) {
  const opt = document.createElement('option');
  opt.value = i; opt.textContent = `GW ${i}`;
  gwSelect.appendChild(opt);
}
gwSelect.value = 38;

let currentGW = 38;
let currentEntry = null;
let currentHistory = null;
let playerMap = {};
let currentId = null;

async function fetchTeam() {
  const id = document.getElementById('fpl-id').value.trim();
  const gw = parseInt(gwSelect.value);
  const err = document.getElementById('error-msg');
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  const btn = document.getElementById('fetch-btn');
  err.style.display = 'none'; result.style.display = 'none';
  if (!id || isNaN(id)) { err.textContent = 'Please enter a valid FPL Team ID.'; err.style.display = 'block'; return; }
  if (!gw) { err.textContent = 'Please select a gameweek.'; err.style.display = 'block'; return; }
  btn.disabled = true; loading.style.display = 'block';
  try {
    if (!Object.keys(playerMap).length) {
      const boot = await fetchWithFallback('https://fantasy.premierleague.com/api/bootstrap-static/');
      boot.elements.forEach(p => { playerMap[p.id] = p; });
    }
    const [entry, hist] = await Promise.all([
      fetchWithFallback(`https://fantasy.premierleague.com/api/entry/${id}/`),
      fetchWithFallback(`https://fantasy.premierleague.com/api/entry/${id}/history/`)
    ]);
    currentEntry = entry; currentHistory = hist; currentGW = gw; currentId = id;
    await renderGW(id, gw);
    loading.style.display = 'none'; result.style.display = 'block';
  } catch(e) {
    loading.style.display = 'none';
    err.textContent = e.message || 'Something went wrong.';
    err.style.display = 'block';
  }
  btn.disabled = false;
}

async function renderGW(id, gw) {
  const gwData = currentHistory.current.find(g => g.event === gw);
  const [picks, liveData] = await Promise.all([
    fetchWithFallback(`https://fantasy.premierleague.com/api/entry/${id}/event/${gw}/picks/`),
    fetchWithFallback(`https://fantasy.premierleague.com/api/event/${gw}/live/`)
  ]);

  const liveMap = {};
  liveData.elements.forEach(e => { liveMap[e.id] = e.stats.total_points; });

  const initials = `${currentEntry.player_first_name[0]}${currentEntry.player_last_name[0]}`.toUpperCase();
  document.getElementById('manager-avatar').textContent = initials;
  document.getElementById('manager-name').textContent = `${currentEntry.player_first_name} ${currentEntry.player_last_name}`;
  document.getElementById('team-name').textContent = currentEntry.name;
  document.getElementById('gw-pts').textContent = gwData ? fmt(gwData.points) : '—';
  document.getElementById('gw-rank').textContent = gwData ? fmt(gwData.rank) : '—';
  document.getElementById('total-pts').textContent = gwData ? fmt(gwData.total_points) : '—';
  document.getElementById('overall-rank').textContent = gwData ? fmt(gwData.overall_rank) : '—';
  document.getElementById('gw-nav-title').textContent = `Gameweek ${gw}`;
  document.getElementById('gw-nav-pts').textContent = gwData ? `${gwData.points} pts` : '—';
  document.getElementById('btn-prev').disabled = gw <= 1;
  document.getElementById('btn-next').disabled = gw >= 38;

  const chip = picks.active_chip;
  document.getElementById('chip-label').textContent = chip ? CHIP_MAP[chip] || chip : 'GW Picks';

  const strip = document.getElementById('history-strip');
  strip.innerHTML = '';
  currentHistory.current.forEach(g => {
    const card = document.createElement('div');
    card.className = 'hs-card' + (g.event === gw ? ' active' : '');
    const chipUsed = currentHistory.chips?.find(c => c.event === g.event);
    card.innerHTML = `<div class="hs-gw">GW${g.event}</div><div class="hs-pts">${g.points}</div>${chipUsed ? `<div class="chip-badge">${CHIP_MAP[chipUsed.name]||chipUsed.name}</div>` : ''}`;
    card.onclick = () => jumpToGW(id, g.event);
    strip.appendChild(card);
  });
  strip.querySelector('.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  renderPicks(picks.picks.filter(p => p.position <= 11), 'picks-grid', liveMap, chip);
  renderPicks(picks.picks.filter(p => p.position > 11), 'bench-grid', liveMap, chip);
}

function renderPicks(picks, containerId, liveMap, chip) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  picks.forEach(pick => {
    const player = playerMap[pick.element];
    if (!player) return;
    const pts = liveMap[pick.element] ?? 0;
    const mult = pick.multiplier > 1 ? pick.multiplier : null;
    const card = document.createElement('div');
    card.className = 'pick-card' + (pick.is_captain ? ' is-captain' : pick.is_vice_captain ? ' is-vice' : '');
    card.innerHTML = `
      <div class="pick-pos ${POS_CLASS[player.element_type]}">${POS_MAP[player.element_type]||'—'}</div>
      <div class="pick-name">${player.web_name}</div>
      <div class="pick-pts ${pts===0?'zero':''}">${mult ? pts * mult : pts}</div>
      ${mult ? `<div class="pick-mult">×${mult} (${pts} base)</div>` : ''}
      <div class="pick-price">£${(player.now_cost/10).toFixed(1)}m</div>
    `;
    grid.appendChild(card);
  });
}

async function jumpToGW(id, gw) {
  currentGW = gw; gwSelect.value = gw;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  try {
    await renderGW(id, gw);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').textContent = e.message;
    document.getElementById('error-msg').style.display = 'block';
  }
}

function navigateGW(dir) {
  const newGW = Math.min(38, Math.max(1, currentGW + dir));
  if (newGW !== currentGW) jumpToGW(currentId, newGW);
}

document.getElementById('fpl-id').addEventListener('keydown', e => { if (e.key === 'Enter') fetchTeam(); });

const params = new URLSearchParams(window.location.search);
if (params.get('id')) {
  document.getElementById('fpl-id').value = params.get('id');
  if (params.get('gw')) gwSelect.value = params.get('gw');
  fetchTeam();
}
</script>
</body>
</html>
