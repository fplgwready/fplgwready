<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FPLGWReady — Your Gameweek Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0B1F; --surface: #161330; --surface2: #1E1A40;
      --accent: #1A6FFF; --accent2: #6C5CE7; --text: #F0EEFF;
      --muted: #8B82C4; --border: rgba(108,92,231,0.2); --radius: 16px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(108,92,231,0.15) 0%, transparent 70%); pointer-events: none; }
    body::after { content: ''; position: fixed; bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(26,111,255,0.12) 0%, transparent 70%); pointer-events: none; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(13,11,31,0.85); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
    .logo span { color: var(--accent2); }
    .nav-badge { background: var(--surface2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 100px; font-size: 13px; color: var(--muted); }
    .hero { max-width: 720px; margin: 80px auto 0; padding: 0 24px; text-align: center; }
    .hero-tag { display: inline-block; background: rgba(26,111,255,0.12); border: 1px solid rgba(26,111,255,0.3); color: #6BA3FF; font-size: 13px; font-weight: 500; padding: 6px 16px; border-radius: 100px; margin-bottom: 28px; letter-spacing: 0.5px; }
    h1 { font-family: 'Syne', sans-serif; font-size: clamp(38px, 7vw, 64px); font-weight: 800; line-height: 1.05; letter-spacing: -2px; margin-bottom: 20px; }
    h1 .hl { color: var(--accent); } h1 .hl2 { color: var(--accent2); }
    .hero-sub { color: var(--muted); font-size: 17px; line-height: 1.7; max-width: 480px; margin: 0 auto 48px; }
    .offseason-banner { background: rgba(108,92,231,0.1); border: 1px solid rgba(108,92,231,0.3); border-radius: 12px; padding: 12px 20px; margin-bottom: 20px; font-size: 13px; color: var(--accent2); text-align: center; }
    .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 16px; text-align: left; }
    .input-label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px; display: block; }
    .input-row { display: flex; gap: 12px; }
    input[type="text"] { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 16px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.2s, transform 0.1s; white-space: nowrap; }
    .btn:hover { opacity: 0.88; } .btn:active { transform: scale(0.98); } .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .input-hint a { color: var(--accent); text-decoration: none; }
    .error-msg { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.2); color: #FF8080; border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-top: 12px; display: none; }
    .loading { display: none; text-align: center; padding: 48px 0; color: var(--muted); }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { display: none; text-align: left; }
    .manager-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 32px; margin-bottom: 16px; }
    .manager-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .manager-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .manager-name { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 2px; }
    .team-name { color: var(--accent2); font-size: 14px; font-weight: 500; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-box { background: var(--surface2); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-val { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
    .section-badge { font-size: 11px; font-family: 'DM Sans', sans-serif; font-weight: 500; background: rgba(26,111,255,0.15); color: #6BA3FF; padding: 3px 10px; border-radius: 100px; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .history-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
    .history-season { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    .history-pts { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: var(--accent); }
    .history-rank { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .countdown-card { background: var(--surface); border: 1px solid rgba(108,92,231,0.4); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 16px; text-align: center; }
    .countdown-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .countdown-nums { display: flex; justify-content: center; gap: 16px; }
    .countdown-block { background: var(--surface2); border-radius: 10px; padding: 12px 16px; min-width: 60px; }
    .countdown-num { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--accent2); }
    .countdown-unit { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .features { max-width: 720px; margin: 48px auto 0; padding: 0 24px 80px; }
    .features-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; text-align: center; margin-bottom: 20px; }
    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .feature-icon { font-size: 22px; margin-bottom: 8px; }
    .feature-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .feature-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
